<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--brand:head (written by tools/apply-brand.ps1 from src/core/brand.js: edit that file, not these lines)-->
<title>Last Squad Standing</title>
<meta name="description" content="Last Squad Standing: a free battle royale that runs in your browser and installs as an app. Parachute in, loot up, ride and be the last squad standing.">
<meta name="author" content="DCeator">
<meta name="theme-color" content="#070a16">
<link rel="icon" type="image/svg+xml" href="assets/brand/emblem.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LSS">
<meta property="og:type" content="website">
<meta property="og:title" content="Last Squad Standing">
<meta property="og:description" content="A free battle royale in your browser. Parachute in, loot up and be the last squad standing. Created by DCeator.">
<meta property="og:image" content="assets/brand/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/brand/og-image.png">
<!--/brand:head-->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/v3.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="manifest" href="manifest.webmanifest">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading" class="screen">
  <h1><img class="brandLogo" src="assets/brand/logo.svg" alt="Last Squad Standing" width="712" height="276"></h1>
  <div id="loadText" class="sub">Loading...</div>
  <div class="loadbar"><div id="loadFill"></div></div>
  <div class="credit" id="loadCredit">Created by DCeator</div>
</div>

<div id="menu" class="hidden"></div>

<div id="rotate"><img class="rotLogo" src="assets/brand/logo.svg" alt="Last Squad Standing" width="712" height="276"><div class="rotIcon">&#128241;</div><h2 data-i18n="ui.rotate">Rotate your phone to play</h2><button id="rotFs" data-i18n="ui.fullscreen">Full screen</button><div class="credit" data-i18n="ui.credit">Created by DCeator</div></div>

<div id="hud" class="hidden">
  <div id="topbar">
    <div class="pill"><span id="aliveCount">0</span> <em data-i18n="hud.alive">alive</em></div>
    <div class="pill"><span id="killCount">0</span> <em data-i18n="hud.kills">kills</em></div>
    <div class="pill" id="zoneInfo">--</div>
  </div>
  <div id="compass"><div id="compassStrip"></div></div>
  <canvas id="minimap" width="220" height="220"></canvas>
  <div id="killfeed"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i></div>
  <div id="reticle"></div>
  <div id="scope"><div class="hline"></div><div class="vline"></div></div>
  <div id="steerHint"></div>
  <div id="hitmarker"></div>
  <div id="vignette"></div>
  <div id="lowhp"></div>
  <div id="flash"></div>
  <div id="under"></div>
  <div id="hidden"></div>
  <div id="dmgInd"></div>
  <div id="prompt"></div>
  <div id="banner"></div>
  <div id="tutBox"></div>
  <div id="useBar"><div id="useFill"></div><span id="useTxt"></span></div>
  <div id="vehicleHud"><span id="speedTxt">0</span><small>km/h</small></div>
  <div id="fps"></div>
  <div id="bottom">
    <div id="slots"></div>
    <div id="ammoBox">
      <div><span id="ammoMag">0</span><span id="ammoRes">/ 0</span></div>
      <div id="ammoMeta"></div>
      <div id="consum"></div>
      <div id="pickups"></div>
    </div>
    <div id="bars">
      <div class="bar shield"><div id="shieldFill"></div><span id="shieldTxt">0</span></div>
      <div class="bar health"><div id="healthFill"></div><span id="healthTxt">100</span></div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="touch" class="hidden"></div>

<div id="pause" class="screen hidden">
  <h2 data-i18n="pause.title">Paused</h2>
  <button id="resumeBtn" data-i18n="pause.resume">Resume</button>
  <button id="pauseSettingsBtn" class="ghost" data-i18n="pause.settings">Settings</button>
  <button id="quitBtn" class="ghost" data-i18n="pause.quit">Back to lobby</button>
  <div class="credit" data-i18n="ui.credit">Created by DCeator</div>
</div>

<div id="endScreen" class="screen hidden">
  <h1 id="endTitle"></h1>
  <p id="endStats" class="sub"></p>
  <div id="endRewards" class="rewards"></div>
  <button id="againBtn" data-i18n="end.again">Play again</button>
  <button id="lobbyBtn" class="ghost" data-i18n="end.lobby">Back to lobby</button>
</div>

<script type="module" src="src/boot.js"></script>
</body>
</html>
